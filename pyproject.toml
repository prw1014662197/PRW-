[project]
name = "langchain-ordering-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "潘叡文", email = "17195964+pan-ruiwen@user.noreply.gitee.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.156.4",
    "langchain-deepseek>=1.1.1",
    "langchain-huggingface[full]",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "langchain-openrouter>=0.2.9",
    "pymilvus",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sentence-transformers>=5.2.0,<6.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
langchain-ordering-agent = "langchain_ordering_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
